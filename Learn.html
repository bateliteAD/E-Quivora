<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemshaBongo - Masomo Broo | Learning Ecosystem</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* === FULL EMBEDDED CSS STYLESHEET === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
        }

        :root {
            --bg-dark: #0b0f17;
            --card-dark: #161f30;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --orange-main: #f9741663;
            --orange-hover: #421e0a;
            --brand-blue: #007acc;
            --purple-acc: #a955f770;
            --green-acc: #10b981;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: var(--orange-main); border-radius: 4px; }

        /* Layout Grid & Structure */
        .app-header {
            background: rgba(22, 31, 48, 0.95);
            border-bottom: 1px solid var(--card-border);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Responsive Home button: stays inside the header on every screen size */
        .app-header {
            gap: 12px;
            min-width: 0;
        }

        .app-header > .brand-logo {
            flex: 1 1 auto;
            min-width: 0;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            min-height: 38px;
            padding: 8px 22px;
            border: 1px solid rgba(249, 115, 22, 0.35);
            border-radius: 10px;
            background: var(--orange-main);
            color: #111827;
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.2s ease, transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .home-btn:hover,
        .home-btn:focus-visible {
            background: var(--orange-hover);
            color: #fff;
        }

        .home-btn:active {
            transform: scale(0.97);
        }

        .home-btn:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }

        .brand-title {
            min-width: 0;
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            .app-header {
                padding: 10px 12px;
                gap: 8px;
            }

            .brand-logo {
                gap: 7px;
            }

            .logo-badge {
                width: 32px;
                height: 32px;
                flex: 0 0 32px;
            }

            .brand-title {
                font-size: clamp(13px, 3.8vw, 16px);
            }

            .home-btn {
                min-height: 36px;
                padding: 8px 12px;
                font-size: 13px;
            }

            .mobile-menu-btn {
                flex: 0 0 auto;
                padding: 4px;
            }
        }

        @media (max-width: 350px) {
            .app-header {
                gap: 6px;
                padding-right: 8px;
                padding-left: 8px;
            }

            .brand-logo {
                gap: 5px;
            }

            .brand-title {
                font-size: 12px;
            }

            .home-btn {
                padding-right: 9px;
                padding-left: 9px;
            }
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--orange-main), var(--brand-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #000;
            font-size: 14px;
        }

        .brand-title {
            font-weight: 800;
            font-size: 18px;
            color: #fff;
        }

        .brand-title span { color: var(--orange-main); }

        /* MOBILE GRADE SELECTION BAR */
        .mobile-grade-bar {
            background: #0f172a;
            border-bottom: 1px solid var(--card-border);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        @media (min-width: 768px) {
            .mobile-grade-bar { display: none; }
            .app-header .mobile-menu-btn { display: none; }
        }

        .grade-bar-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--orange-main);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .grade-pills-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .grade-pills-scroll::-webkit-scrollbar { display: none; }

        .grade-pill {
            background: #1e293b;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .grade-pill.active {
            background: var(--orange-main);
            color: #000;
            border-color: var(--orange-main);
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.4);
        }

        /* App Main Container */
        .main-container {
            display: flex;
            flex: 1;
            position: relative;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 280px;
            background: var(--card-dark);
            border-right: 1px solid var(--card-border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
        }

        @media (min-width: 768px) {
            .sidebar {
                position: static;
                transform: none !important;
            }
        }

        .sidebar.closed {
            transform: translateX(-100%);
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }

        .nav-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--orange-main);
            color: #000;
        }

        .nav-btn i { width: 20px; }

        /* Content Display Area */
        .content-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .glass-card {
            background: rgba(22, 31, 48, 0.7);
            border: 1px solid var(--card-border);
            border-radius: 0px;
            padding: 24px;
            backdrop-filter: blur(12px);
            margin-bottom: 24px;
        }

        /* Hero Banner */
        .hero-banner {
            background: linear-gradient(135deg, #0f172a 0%, #161f30 100%);
            border: 1px solid var(--card-border);
            border-radius: 0px;
            padding: 36px 24px;
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .hero-banner h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .hero-banner h1 span { color: var(--orange-main); }

        .hero-banner p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            max-width: 650px;
            margin-bottom: 24px;
        }

        .btn-primary {
            background: var(--orange-main);
            color: #000;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 3px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-primary:hover { background: var(--orange-hover); }

        /* Grid Layouts for Subjects & Papers */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .subject-card {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 2px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .subject-card:hover {
            transform: translateY(-3px);
            border-color: var(--orange-main);
        }

        .subject-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(249, 115, 22, 0.15);
            color: var(--orange-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* Toast Popup */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0f172a;
            border: 1px solid var(--orange-main);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 200;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .sound-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 10px 14px;
            border: 1px solid var(--steel);
            background: var(--white);
            color: var(--carbon);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.25s ease, color 0.25s ease;
}
.sound-toggle:hover { background: var(--volt); border-color: var(--carbon); }

.music-controls {
  display: flex;

.music-toggle {
  padding: 10px 12px;

.music-volume {
  width: 65px;
  accent-color: var(--volt);
  cursor: pointer;
}

    </style>
</head>

    <!-- SYSTEM JAVASCRIPT LOGIC -->
    <script>
        const gradeCurriculum = {
            1: ["Mathematics", "English Activity", "Kiswahili Shughuli", "Environmental Activities"],
            2: ["Mathematics", "English Activity", "Kiswahili Shughuli", "Environmental Activities"],
            3: ["Mathematics", "English Activity", "Kiswahili Shughuli", "Environmental Activities"],
            4: ["Mathematics", "English Language", "Kiswahili Lugha", "Science & Tech", "Agriculture"],
            5: ["Mathematics", "English Language", "Kiswahili Lugha", "Science & Tech", "Agriculture"],
            6: ["Mathematics", "English Language", "Kiswahili Lugha", "Science & Tech", "Agriculture"],
            7: ["Mathematics", "English", "Kiswahili", "Integrated Science", "Agriculture", "Pre-Technical Studies", "Social Studies", "CRE"],
            8: ["Mathematics", "English", "Kiswahili", "Integrated Science", "Agriculture", "Pre-Technical Studies", "Social Studies", "CRE"],
            9: ["Mathematics", "English", "Kiswahili", "Integrated Science", "Agriculture", "Pre-Technical Studies", "Social Studies", "CRE"]
        };

        // Add or edit your files here. Use paths relative to this HTML file,
        // or paste a full https:// URL. Keys follow the format "GRADE-Subject".
        // Example: "7-Mathematics": "files/grade7/mathematics-notes.html"
        const resourceLinks = {
            notes: {
                "7-Mathematics": "files/grade7/mathematics-notes.html"
            },
            papers: {
                "7-Mathematics": "files/grade7/mathematics-paper.pdf"
            }
        };

        let currentGrade = 7;

        // Grade Synchronization
        function setGrade(gradeNum) {
            currentGrade = gradeNum;
            document.getElementById("notesGradeTitle").textContent = `Grade ${gradeNum}`;
            document.getElementById("papersGradeTitle").textContent = `Grade ${gradeNum}`;

            // Update mobile pill active styles
            document.querySelectorAll(".grade-pill").forEach(pill => {
                pill.classList.toggle("active", pill.getAttribute("data-grade") == gradeNum);
            });

            // Sync desktop select
            document.getElementById("desktopGradeSelect").value = gradeNum;

            renderSubjects(gradeNum);
            showToast(`Grade updated to Grade ${gradeNum}`);
        }

        // Render Subject Cards
        function renderSubjects(gradeNum) {
            const subjects = gradeCurriculum[gradeNum] || gradeCurriculum[7];

            const notesGrid = document.getElementById("notesGrid");
            notesGrid.innerHTML = subjects.map(sub => {
                const key = `${gradeNum}-${sub}`;
                const href = resourceLinks.notes[key] || "#";
                return `
                    <div class="subject-card">
                        <div>
                            <div class="subject-icon"><i class="fas fa-book"></i></div>
                            <h4 style="margin-top:10px; color:#fff;">${sub}</h4>
                            <p style="font-size:12px; color:var(--text-muted); margin-top:4px;">Grade ${gradeNum} syllabus topic notes.</p>
                        </div>
                        <a href="${href}" ${href === "#" ? `onclick="showToast('Add this subject file path in resourceLinks first.'); return false;"` : 'target="_blank" rel="noopener"'}
                           class="btn-primary" style="width:100%; justify-content:center; padding:8px; text-decoration:none;">Start</a>
                    </div>
                `;
            }).join("");

            const papersGrid = document.getElementById("papersGrid");
            papersGrid.innerHTML = subjects.map(sub => {
                const key = `${gradeNum}-${sub}`;
                const href = resourceLinks.papers[key] || "#";
                return `
                    <div class="subject-card">
                        <div>
                            <div class="subject-icon" style="color:var(--purple-acc); background:rgba(168,85,247,0.15);"><i class="fas fa-file-pdf"></i></div>
                            <h4 style="margin-top:10px; color:#fff;">G${gradeNum} ${sub} Paper</h4>
                            <p style="font-size:12px; color:var(--text-muted); margin-top:4px;">Model revision question paper.</p>
                        </div>
                        <a href="${href}" ${href === "#" ? `onclick="showToast('Add this paper file path in resourceLinks first.'); return false;"` : 'target="_blank" rel="noopener"'}
                           class="btn-primary" style="width:100%; justify-content:center; padding:8px; background:var(--purple-acc); text-decoration:none;">Start</a>
                    </div>
                `;
            }).join("");
        }

        // Tab Switcher
        function switchTab(tabId) {
            document.querySelectorAll(".tab-content").forEach(el => el.style.display = "none");
            document.getElementById(`tab-${tabId}`).style.display = "block";
            
            document.querySelectorAll(".nav-btn").forEach(btn => {
                btn.classList.toggle("active", btn.getAttribute("data-tab") === tabId);
            });

            document.getElementById("sidebar").classList.add("closed");
        }

        // Mobile Sidebar Controls
        document.getElementById("mobileMenuBtn").addEventListener("click", () => {
            document.getElementById("sidebar").classList.remove("closed");
        });
        document.getElementById("closeSidebarBtn").addEventListener("click", () => {
            document.getElementById("sidebar").classList.add("closed");
        });

        // Event Listeners for Mobile & Desktop Grade Selectors
        document.getElementById("mobileGradePills").addEventListener("click", (e) => {
            if (e.target.classList.contains("grade-pill")) {
                setGrade(e.target.getAttribute("data-grade"));
            }
        });

        document.getElementById("desktopGradeSelect").addEventListener("change", (e) => {
            setGrade(e.target.value);
        });

        document.querySelectorAll(".nav-btn").forEach(btn => {
            btn.addEventListener("click", () => switchTab(btn.getAttribute("data-tab")));
        });

        // Toast Notification Helper
        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 3000);
        }
/* ==========================================
     SOUND EFFECTS CONTROLLER (EXTERNAL FILES)
  ========================================== */
  var soundToggle = document.getElementById("soundToggle");
  var soundEnabled = true;
  var lastHoverTime = 0;

  var sfxClick = document.getElementById("sfxClick");
  var sfxHover = document.getElementById("sfxHover");
  var sfxPlay = document.getElementById("sfxPlay");
  var sfxSwitch = document.getElementById("sfxSwitch");

  function playAudioFile(audioElem) {
    if (!soundEnabled || !audioElem) return;
    try {
      audioElem.currentTime = 0;
      audioElem.play().catch(function () {});
    } catch (e) {}
  }

  function triggerClickSound() { playAudioFile(sfxClick); }
  function triggerHoverSound() {
    var now = Date.now();
    if (now - lastHoverTime < 150) return;
    lastHoverTime = now;
    playAudioFile(sfxHover);
  }
  function triggerPlayButtonSound() { playAudioFile(sfxPlay); }
  function triggerSwitchSound() { playAudioFile(sfxSwitch); }

  // Global click event handler
  document.addEventListener("click", function (event) {
    var target = event.target;
    if (!target || !target.closest) return;

    var interactive = target.closest("button, .Play, .hud-brand");
    if (!interactive) return;
    if (interactive.id === "soundToggle" || interactive.id === "themeToggle") return;

    if (interactive.matches(".Play") || interactive.closest(".Play")) {
      triggerPlayButtonSound();
    } else {
      triggerClickSound();
    }
  });

  // Card hover sound effects
  slices.forEach(function (slice) {
    slice.addEventListener("mouseenter", function () {
      if (slice !== document.activeElement) triggerHoverSound();
    });
  });

  // Play Button hover sound effect
  var playBtn = document.querySelector(".Play");
  if (playBtn) {
    playBtn.addEventListener("mouseenter", triggerHoverSound);
  }

  // Tab switch sound effects
  tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      triggerSwitchSound();
    });
  });

  // Mute / Unmute control for sound effects
  if (soundToggle) {
    soundToggle.addEventListener("click", function () {
      soundEnabled = !soundEnabled;
      soundToggle.textContent = soundEnabled ? "🔊 Sound On" : "🔇 Sound Off";
      soundToggle.setAttribute("aria-pressed", String(soundEnabled));
      soundToggle.setAttribute("aria-label", soundEnabled ? "Mute sound" : "Enable sound");
      if (soundEnabled) triggerClickSound();
    });
  }

  /* ==========================================
     BACKGROUND MUSIC CONTROLLER (EXTERNAL FILE)
  ========================================== */
  var musicToggle = document.getElementById("musicToggle");
  var musicVolume = document.getElementById("musicVolume");
  var bgMusic = document.getElementById("bgMusic");
  var musicEnabled = true;

  if (bgMusic && musicVolume) {
    bgMusic.volume = Number(musicVolume.value) / 100;
  }

  function startBackgroundMusic() {
    if (!musicEnabled || !bgMusic) return;
    bgMusic.play().catch(function () {});
  }

  function stopBackgroundMusic() {
    if (bgMusic) {
      bgMusic.pause();
    }
  }

  document.addEventListener("pointerdown", function (event) {
    if (event.target.closest && event.target.closest("#musicToggle")) return;
    startBackgroundMusic();
  }, { once: true });

  if (musicToggle && bgMusic) {
    musicToggle.addEventListener("click", function () {
      musicEnabled = !musicEnabled;
      if (musicEnabled) {
        musicToggle.textContent = "♫ Music On";
        musicToggle.setAttribute("aria-pressed", "true");
        startBackgroundMusic();
      } else {
        musicToggle.textContent = "♫ Music Off";
        musicToggle.setAttribute("aria-pressed", "false");
        stopBackgroundMusic();
      }
    });
  }

  if (musicVolume && bgMusic) {
    musicVolume.addEventListener("input", function () {
      bgMusic.volume = Number(musicVolume.value) / 100;
    });
  }

        // Init App
        window.addEventListener("DOMContentLoaded", () => {
            setGrade(7);
        
        });
    </script>
</body>
