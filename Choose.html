<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make Your Choice - Crossword System</title>
  <meta name="description" content="Select your path in the Nexus industrial tech design system.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="templatemo-629-nexus-style.css">
  <style>
    /* Custom styling adjustments to integrate the choice screen into the Nexus theme */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0d0f12;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #f8fafc;
      padding: 20px;
    }

    .choice-container {
      background: rgba(18, 22, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      position: relative;
    }

    .choice-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ccff00, transparent);
    }

    .mono-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #ccff00;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 35px;
    }

    .button-group {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .btn {
      flex: 1;
      display: inline-block;
      padding: 14px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 4px;
      transition: all 0.2s ease;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-primary {
      background-color: transparent;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-primary:hover {
      background-color: #b3e000;
      border: 1px solid #ccff00;
      box-shadow: 0 0 15px rgba(204, 255, 0, 0.4);
      color: #0d0f12;
    }

    .btn-secondary {
      background-color: transparent;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background-color: #b3e000;
      border: 1px solid #ccff00;
      box-shadow: 0 0 15px rgba(204, 255, 0, 0.4);
      color: #0d0f12;
    }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: #94a3b8;
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #ccff00;
    }
  </style>
</head>
<body>

  <div class="choice-container">
    <div class="mono-tag">01 / System Navigation</div>
    <h1>Make Your Choice</h1>
    <p class="subtitle">Select your operational pathway below.</p>

    <!-- Buttons linking to Game or Reading -->
    <div class="button-group">
      <a href="learning_game_arcade.html" class="btn btn-primary">Game</a>
      <a href="Learn.html" class="btn btn-secondary">Read</a>
    </div>

    <div>
      <a href="index.html" class="back-link">&larr; Return to Main Hub</a>
    </div>
  </div>

</body>
</html>
